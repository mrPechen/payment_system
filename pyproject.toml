[project]
name = "payment-system"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0,<0.144.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
    "gunicorn>=26.0.0,<27.0.0",
    "pydantic>=2.14.0,<3.0.0",
    "pydantic-settings>=2.16.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.1.0,<3.0.0",
    "asyncpg>=0.32.0,<0.33.0",
    "alembic>=1.20.0,<2.0.0",
    "faststream[rabbit]>=0.7.7,<1.0.0",
    "httpx>=0.28.0,<0.29.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0,<1.0.0",
    "opentelemetry-instrumentation-logging>=0.66b0,<1.0.0",
    "opentelemetry-sdk>=1.45.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.0.0,<27.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "testcontainers[postgres,rabbitmq]>=4.15.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires docker"]
